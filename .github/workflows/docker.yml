name: Build and Push Docker Image

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linting and type check
        run: |
          npm run format:check
          npm run lint
          npm run typecheck

      - name: Build application
        run: npm run build

      - name: Run tests
        run: echo "No tests yet - add with Vitest"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Package production runtime assets from private provider
        env:
          ASSETS_READ_TOKEN: ${{ secrets.ASSETS_READ_TOKEN }}
        run: |
          set -eu
          if [ -z "${ASSETS_READ_TOKEN:-}" ]; then
            echo "::error::ASSETS_READ_TOKEN is required to package production runtime assets."
            exit 1
          fi

          TMP_DIR=$(mktemp -d)
          trap 'rm -rf "$TMP_DIR"' EXIT HUP INT TERM
          git clone --depth 1 "https://x-access-token:${ASSETS_READ_TOKEN}@github.com/KirkDiggler/rpg-game-assets.git" "$TMP_DIR"

          RPG_GAME_ASSETS_PATH="$TMP_DIR" \
            RPG_WEB_ROOT="$GITHUB_WORKSPACE" \
            ASSETS_SYNC_SKIP_UPDATE=1 \
            sh scripts/sync-game-assets.sh --runtime-assets

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VITE_DISCORD_CLIENT_ID=${{ secrets.VITE_DISCORD_CLIENT_ID }}
            VITE_API_HOST=${{ secrets.VITE_API_HOST }}
            BUILD_ID=${{ github.sha }}
            VITE_FEEL_LAB=1

      - name: Trigger deployment
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        uses: benc-uk/workflow-dispatch@e2e5e9a103e331dad343f381a29e654aea3cf8fc # v1.2.4
        with:
          workflow: deploy.yml
          repo: KirkDiggler/rpg-deployment
          token: ${{ secrets.DEPLOYMENT_TOKEN }}
          inputs: '{"source": "rpg-dnd5e-web", "sha": "${{ github.sha }}"}'
