name: Licensed exact-head asset gate

on:
  pull_request:
    branches: [dev]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  licensed-exact-head:
    name: Licensed exact-head asset gate
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == 'KirkDiggler' &&
      github.actor == 'KirkDiggler' &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    environment: licensed-assets
    steps:
      - name: Check out exact Web PR head without persisted credentials
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Prove same-repository current exact head
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq .head.repo.full_name)" = "$GITHUB_REPOSITORY"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq .head.sha)" = "$EXPECTED_SHA"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq .user.login)" = "KirkDiggler"

      - name: Read exact provider SHA from aggregate lock
        id: lock
        run: echo "sha=$(node -p "require('./src/rendering/visualPlacement/provider-lock.json').provider.commit")" >> "$GITHUB_OUTPUT"

      # The environment secret is scoped to this one checkout action. The
      # provider credential is not persisted in git config and no following
      # PR-head command receives it.
      - name: Check out locked private provider read-only
        uses: actions/checkout@v4
        with:
          repository: KirkDiggler/rpg-game-assets
          ref: ${{ steps.lock.outputs.sha }}
          token: ${{ secrets.RPG_GAME_ASSETS_READ_TOKEN }}
          path: .private-provider
          persist-credentials: false

      - name: Prove detached clean provider and scrub credential state
        run: |
          set -euo pipefail
          test "$(git -C .private-provider rev-parse HEAD)" = "${{ steps.lock.outputs.sha }}"
          ! git -C .private-provider symbolic-ref -q HEAD
          test -z "$(git -C .private-provider status --porcelain)"
          ! git -C .private-provider config --get-regexp 'http\..*\.extraheader|credential|url\..*\.insteadof'
          ! git config --global --get-regexp 'http\..*\.extraheader|credential|url\..*\.insteadof'

      - name: Setup pinned Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Exact-provider checks and atomic complete-tree stage
        run: ./scripts/stage-locked-synty-assets.sh --provider-checkout "$GITHUB_WORKSPACE/.private-provider"

      - name: Install, run native gates, and build the staged application
        run: |
          set -euo pipefail
          npm ci
          npm run format:check
          npm run lint
          npm run typecheck
          npm test -- --run
          npm run perf:visual-placement
          npm run build
          docker build --build-arg BUILD_ID="${GITHUB_SHA}" -t rpg-dnd5e-web:licensed-gate .

      - name: Reject licensed or credential material from tracked output
        run: |
          set -euo pipefail
          test -z "$(git status --short --untracked-files=all | grep -Ev '^\?\? \.private-provider/' || true)"
          ! git diff --name-only "${{ github.event.pull_request.base.sha }}"...HEAD | grep -Ei '\.(glb|fbx|blend|zip|7z|rar)$'
          ! git grep -IlE 'gh[pousr]_[A-Za-z0-9_]{20,}|github_pat_[A-Za-z0-9_]+' -- . ':!package-lock.json'

      - name: Create allowlisted safe evidence only
        run: |
          set -euo pipefail
          mkdir -p safe-evidence
          cp src/rendering/visualPlacement/provider-lock.json safe-evidence/provider-lock.json
          cp src/rendering/visualPlacement/synty-web-assets.json safe-evidence/synty-web-assets.json
          printf 'webSha=%s\nproviderSha=%s\nnode=%s\n' \
            "$GITHUB_SHA" "${{ steps.lock.outputs.sha }}" "$(node --version)" \
            > safe-evidence/gate-summary.txt
          test "$(find safe-evidence -type f | wc -l)" -eq 3
          ! find safe-evidence -type f ! -name '*.json' ! -name '*.txt' | grep .
          ! grep -RIlE 'gh[pousr]_[A-Za-z0-9_]{20,}|github_pat_[A-Za-z0-9_]+' safe-evidence

      - name: Upload safe aggregate evidence
        uses: actions/upload-artifact@v4
        with:
          name: licensed-exact-head-safe-${{ github.event.pull_request.head.sha }}
          path: safe-evidence/
          if-no-files-found: error
          retention-days: 14
