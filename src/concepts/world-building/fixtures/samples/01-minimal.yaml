# SAMPLE 1 — the smallest valid v4 site.
#
# What it exercises: the three v4 keys in their minimum form.
#   - a root `factions:` with ONE faction and nothing else on it
#   - a `faction:` on a placement (the actor carries membership)
#   - NO `monsterBindings` at all: four creatures in one faction with no
#     overrides need no orders blocks, which is the whole point of the split
#   - NO `dispositions:`: absence is the authored state
#
# What it should NOT do: the skeleton is in `goblins`, and with no disposition
# written, `DefaultStance` makes any declared faction hostile to `party` — so a
# fight forms on frame one. That is correct and deliberate: neutrality is
# AUTHORED, never free. Compare sample 3, which says so explicitly.
version: 4
key: sample-minimal
play: { void: transparent, lighting: bright, standing: centre-covered }
factions:
  - { id: goblins }
room:
  version: 3
  id: room-1
  name: Minimal
  coordinateFrame:
    {
      horizontalPlane: world-xz,
      verticalAxis: world-y-up,
      distanceUnit: world-scene-unit,
      hexRadius: 1,
      footprintFrame: owner-local-xz,
    }
  workspace: { hexRadius: 6, horizontalLimit: 12 }
  scene:
    version: 1
    id: scene-1
    name: Minimal
    items: []
    groups: []
  room:
    implicitRegionId: room-1-region
    # The skeleton stands at {2,0}, so that cell must be walkable — the engine
    # refuses a placement on a cell the author never made standable:
    # "at author's axial q=2 r=0: is not standable".
    walkableHexes:
      [
        { q: 0, r: 0 },
        { q: 1, r: 0 },
        { q: 2, r: 0 },
        { q: 0, r: 1 },
        { q: -1, r: 1 },
        { q: 0, r: -1 },
        { q: 1, r: -1 },
      ]
    propDeclarations: {}
    arrangementDeclarations: {}
    partyStart: { q: 0, r: 0 }
    monsters:
      - {
          id: skeleton-a,
          ref: 'dnd5e:monsters:skeleton',
          cell: { q: 2, r: 0 },
          faction: goblins,
        }
