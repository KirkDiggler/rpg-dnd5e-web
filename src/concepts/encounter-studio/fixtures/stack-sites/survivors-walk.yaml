# THE SURVIVORS WALK (Frank's list S4, rpg-project#718): a throwaway site that
# lives only in the franks-list-s1 api worktree and the castle stack. CUT FROM
# THE CASTLE through the gate walk's frame: the gatehouse, its five walls and
# its two doors, and the open ground around it. Nobody else is here.
#
# The band, three of them in the gatehouse yard, hostile to the party UNTIL
# THEIR LEADER IS DOWN (`until: { down: leader }`):
#   leader      in front, one hit die of d4 and no armor: two hit points.
#   follower-1  on his left; the band's mind.
#   follower-2  on his right.
# Nobody wrote a line of their own. The FACTION writes two, so whichever
# survivor is addressed speaks them:
#   yield   "Yield and live."          Persuasion DC 10; success: "We yield."
#                                      and the fact `band-yielded`.
#   refuse  "Throw down your arms."    Intimidation DC 15; failure only:
#                                      "We fight on."
# The way back to the fight is provocation (lane D4): a blow either way
# across the neutral pair turns it hostile again. No endings: leave by the
# lobby.
#
# TRY IT (lobby: "survivors-walk").
#   1. The fall: walk north into the gatehouse yard; the band sees you and the
#      fight forms. Drop the leader (two hit points; one blow does it). The
#      story log says the band stood down because of the leader's fall, and
#      the fight dissolves: everybody is back on the world clock.
#   2. Yield: speak to a follower. The action panel offers the band's two
#      lines though no follower wrote one. Say "Yield and live." and beat
#      DC 10: "We yield."; walk around them; nobody swings.
#   3. Refuse: play again, drop the leader, and say "Throw down your arms."
#      to a follower and miss: "We fight on.", and still nobody swings. Strike
#      that follower: the band turns hostile and the fight re-forms.
#   4. The fallen: speak to the downed leader. The panel offers him no lines,
#      and a line sent to him anyway is refused with a sentence.
version: 5
key: survivors-walk
play: {void: transparent, lighting: bright, standing: centre-covered}
templates:
  follower:
    base: dnd5e:monsters:human
    name: Band Follower
    hitDice: 2d8
    armor: dnd5e:armor:chain-shirt
    abilities: {str: 13, con: 12, wis: 11}
    actions: ['dnd5e:weapons:spear']
  weak-leader:
    base: dnd5e:monsters:human
    name: Band Leader
    hitDice: 1d4
    actions: ['dnd5e:weapons:club']
tables:
  band:
    time:
    - when: {enemy: reach}
      attack: enemy
    - when: {enemy: seen}
      toward: enemy
    - when: {enemy: none}
      hold: {}
factions:
- id: band
  mind: follower-1
  table: band
  options:
  - id: yield
    say: Yield and live.
    check:
    - {ability: persuasion, dc: 10}
    success:
    - {say: We yield., fact: band-yielded}
  - id: refuse
    say: Throw down your arms.
    check:
    - {ability: intimidation, dc: 15}
    failure:
    - {say: We fight on.}
dispositions:
- between: [band, party]
  stance: hostile
  until: {down: leader}
