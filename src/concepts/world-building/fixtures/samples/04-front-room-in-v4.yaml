# SAMPLE 4 — the Front Room, in v4, and the one thing v4 cannot yet say.
#
# This is `rpg-api/content/reference-front-room.yaml` (the ONLY scenario proven to
# run, authored in v2) expressed in the dialect the World Builder emits. It is the
# fixture for the walk: if v4 plays the same as v2, the dialect is equivalent for
# everything the front room exercises.
#
# WHAT TRANSLATES, and does so exactly:
#   - the goblins are NEUTRAL, authored — not free. Without the disposition the
#     goblin attacks on frame one and there is no front room.
#   - the bandits are hostile from the start.
#   - the goblin's two LINES (rpg-project#569): the threat at Intimidation DC 12
#     and the appeal at Persuasion DC 10, "this goblin would rather be talked to
#     than shouted at", each carrying what it answers on either verdict. These
#     replaced v2's `intimidate:`/`persuade:` checks and the four social table
#     keys, which the engine now refuses in both dialects.
#   - its `time` table, each entry one word.
#   - NO `mind`: a faction of ONE has its single member as its mind, so the
#     neutral pair (which waits on nothing) needs none.
version: 4
key: sample-front-room-v4
play: { void: transparent, lighting: bright, standing: centre-covered }
factions:
  - { id: goblins }
  - { id: bandits }
dispositions:
  # The whole front room, in one line. Delete it and this becomes a fight.
  - { between: [goblins, party], stance: neutral }
  - { between: [bandits, party], stance: hostile }
room:
  version: 3
  id: room-1
  name: Front Room
  coordinateFrame:
    {
      horizontalPlane: world-xz,
      verticalAxis: world-y-up,
      distanceUnit: world-scene-unit,
      hexRadius: 1,
      footprintFrame: owner-local-xz,
    }
  workspace: { hexRadius: 6, horizontalLimit: 12 }
  scene:
    version: 1
    id: scene-1
    name: Front Room
    items: []
    groups: []
  room:
    implicitRegionId: room-1-region
    walkableHexes:
      [
        { q: 0, r: 0 },
        { q: 1, r: 0 },
        { q: 2, r: 0 },
        { q: 3, r: 0 },
        { q: 4, r: 0 },
        { q: 0, r: 1 },
        { q: -1, r: 1 },
        { q: -1, r: 0 },
        { q: 0, r: -1 },
        { q: 1, r: -1 },
        { q: 2, r: -1 },
        { q: 3, r: -1 },
      ]
    propDeclarations: {}
    arrangementDeclarations: {}
    partyStart: { q: 0, r: 0 }
    monsterDeclarations:
      - {
          id: front-goblin,
          ref: 'dnd5e:monsters:goblin',
          startingCell: { location: { q: 4, r: 0 } },
        }
    monsterBindings:
      # TWO LINES, each with its check and what is answered on either verdict,
      # plus the world clock. Every row is the author's line and at most one
      # word, carried verbatim onto the beat — the engine never composes
      # speech.
      #
      # THE GRAMMAR SPLIT: a TIME trigger takes time actions (`attack`,
      # `toward`, `away`, `hold`); a VERDICT takes `say` and a result word
      # (`fact`, `flee`) and NEVER a time action —
      #   "`attack` is what a creature does with time, and `failure` is an
      #    outcome".
      # And `toward: {at: [col,row]}` is refused here: the selector's cell is an
      # offset in a document orientation this dialect does not have, so name
      # `enemy`/`attacker`/`actor` or wait for the sites layer.
      front-goblin:
        faction: goblins
        options:
          - id: lean-on-it
            say: "Where's the cellar? Tell me or you're next."
            check: [{ ability: intimidation, dc: 12 }]
            success:
              - {
                  weight: 70,
                  say: 'Fine! The cellar door is behind the barrels.',
                  fact: goblin-cowed,
                }
              - { weight: 30, say: 'Boss! BOSS!', flee: {} }
            # A missed threat costs nothing, deliberately.
            failure:
              - { say: 'Big talk, for someone standing in my doorway.' }
          - id: talk-it-round
            say: "We're not here for you. Where did the bandits go?"
            check: [{ ability: persuasion, dc: 10 }]
            # A landed appeal tells the truth and teaches nothing — talking
            # somebody round is not frightening them.
            success:
              - {
                  say: 'Bandits took the cellar. Go left at the rope, and mind the third step.',
                }
            # A failed appeal, and the lie is a FACT like any other. There is
            # no truth bit on the wire, by ruling.
            failure:
              - {
                  weight: 100,
                  say: "Cellar's empty, friend. Nothing down there but rats.",
                  fact: cellar-is-clear,
                }
        on:
          # TIME, where the time actions are legal.
          time:
            - { when: { enemy: reach }, attack: enemy }
            - { when: { enemy: seen }, toward: enemy }
